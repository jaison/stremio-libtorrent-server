# Stremio libtorrent streaming server — production Compose.
# The definition is also suitable for Coolify's Git-based Docker Compose deployment.
#
# Coolify:
#   - configure the public domain on this service for internal port 8080;
#   - the persistent storage and healthcheck below are managed by this file;
#   - only 6881 is published by default because it is the optional BitTorrent inbound port.
#
# Plain Docker:
#   docker compose up -d
# NVIDIA:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
services:
  stremio-libtorrent-server:
    build: .
    image: stremio-libtorrent-server:latest
    restart: unless-stopped

    environment:
      # BitTorrent peer port inside the container. The published port below follows it automatically.
      STREMIOSRV_BT_LISTEN_PORT: "${STREMIOSRV_BT_LISTEN_PORT:-6881}"

      # Application data, cache, certificates, labels and fast-resume all live here.
      STREMIOSRV_CACHE_ROOT: /root/.stremio-server
      CERT_FILE: certificates.pem

      # Leave IPADDRESS empty on reverse-proxy platforms such as Coolify. In that mode HTTPS is
      # terminated by the platform proxy and SERVER_URL is the public origin.
      IPADDRESS: ${IPADDRESS:-}
      # Coolify can generate SERVICE_URL_* from the service's configured domain. SERVER_URL therefore
      # follows that domain automatically, while plain Docker can override it explicitly.
      SERVICE_URL_STREMIO_LIBTORRENT_SERVER_8080: ${SERVICE_URL_STREMIO_LIBTORRENT_SERVER_8080:-}
      SERVER_URL: ${SERVER_URL:-${SERVICE_URL_STREMIO_LIBTORRENT_SERVER_8080}}

      # Recommended library deployment settings.
      STREMIOSRV_CACHE_SIZE: "${STREMIOSRV_CACHE_SIZE:-10GB}"
      STREMIOSRV_LIBRARY_UI: "${STREMIOSRV_LIBRARY_UI:-true}"
      STREMIOSRV_SEED_ON_COMPLETE: "${STREMIOSRV_SEED_ON_COMPLETE:-false}"

    # Internal ports. Coolify routes the public domain to 8080; the API ports stay private.
    expose:
      - "8080"
      - "11470"
      - "12470"

    # Only BitTorrent needs direct host exposure. Remove these two lines if inbound peering is not
    # desired; playback/downloads still work with outbound connections.
    ports:
      - "${STREMIOSRV_BT_LISTEN_PORT:-6881}:${STREMIOSRV_BT_LISTEN_PORT:-6881}/tcp"
      - "${STREMIOSRV_BT_LISTEN_PORT:-6881}:${STREMIOSRV_BT_LISTEN_PORT:-6881}/udp"

    volumes:
      # Compose-owned persistent storage. Coolify displays this mount as Persistent Storage.
      # STREMIO_DATA_DIR can still replace the named volume with a server path for plain Docker.
      - ${STREMIO_DATA_DIR:-stremio-cache}:/root/.stremio-server

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11470/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  stremio-cache:
